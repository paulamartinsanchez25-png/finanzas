<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mis finanzas</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#16a34a"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f4f9;--cd:#fff;--tx:#161a2b;--mu:#6b7090;--bd:#e3e5f0;--pr:#5b4bff;--ok:#16a34a;--bd2:#e5334b;--wa:#f59e0b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1e;--cd:#171a2e;--tx:#eef0ff;--mu:#9a9fc4;--bd:#262a46;--pr:#8b7dff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f1e;--cd:#171a2e;--tx:#eef0ff;--mu:#9a9fc4;--bd:#262a46;--pr:#8b7dff;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
main{max-width:760px;margin:auto;padding:14px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g3 .cd{margin:0;padding:10px}.g3 .big{font-size:18px}
button,input,select{font:inherit;color:inherit}
button{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;cursor:pointer}
.pr{background:var(--pr);color:#fff;border-color:var(--pr)}
input,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:4px 0 8px}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat{margin-bottom:12px}.mv{padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}
.al{border-left:4px solid var(--bd2);background:var(--cd);padding:10px;border-radius:12px;margin-bottom:12px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 6px 18px #0004}
#m{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5}
#m>div{background:var(--cd);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
.sc{overflow-x:auto}.fl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
textarea{width:100%;height:110px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px}
</style></head><body><main id="app"></main><button class="fab pr" onclick="edit()" aria-label="Añadir">+</button><div id="m" onclick="if(event.target==this)cl()"><div id="mb"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const K='finanzas-paula-v1',$=s=>document.querySelector(s),E=n=>n.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const DC=[['casa','Casa','🏠',600,'#5b4bff'],['sum','Suministros','💡',180,'#0ea5e9'],['com','Comida','🛒',200,'#16a34a'],['mem','Membresías','🎟️',30,'#ec4899'],['gas','Gasolina','⛽',60,'#f59e0b'],['oci','Ocio','🎬',300,'#8b5cf6'],['via','Viajes y gastos puntuales','✈️',200,'#14b8a6']].map(a=>({id:a[0],n:a[1],i:a[2],l:a[3],c:a[4]}));
const IC=[['nom','Nómina'],['fre','Freelance'],['ext','Extras'],['otr','Otros']],MT=['Tarjeta','Efectivo','Bizum','Transferencia'];
let S,ym=new Date().toISOString().slice(0,7),F={q:'',c:'',t:'',m:''};
const uid=()=>Math.random().toString(36).slice(2,9),sum=a=>a.reduce((s,t)=>s+t.a,0),tx=m=>S.tx.filter(t=>t.d.slice(0,7)===m);
function nx(m,k){const d=new Date(+m.slice(0,4),+m.slice(5)-1+k,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
const MN=m=>new Date(m+'-15').toLocaleDateString('es-ES',{month:'long',year:'numeric'}),MS=m=>new Date(m+'-15').toLocaleDateString('es-ES',{month:'short'});
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S={cats:DC,tx:[],inc:{},goal:{n:'Viaje a Japón',t:1500,s:0},sv:200}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function rec(){const now=new Date().toISOString().slice(0,7);let ch=0;S.tx.filter(t=>t.rec).forEach(t=>{let m=t.d.slice(0,7);while((m=nx(m,1))<=now){if(!S.tx.some(x=>x.src===t.id&&x.d.slice(0,7)===m)){S.tx.push({...t,id:uid(),src:t.id,rec:false,d:m+'-'+String(Math.min(+t.d.slice(8),28)).padStart(2,'0')});ch=1}}});ch&&save()}
const cat=id=>S.cats.find(c=>c.id===id)||{n:(IC.find(x=>x[0]===id)||[0,'Otros'])[1],i:'💰',c:'#888'};
function render(){rec();const T=tx(ym),ex=T.filter(t=>t.t==='g'),inc=(S.inc[ym]||0)+sum(T.filter(t=>t.t==='i')),gas=sum(ex),left=inc-gas;
const pg=sum(tx(nx(ym,-1)).filter(t=>t.t==='g')),p=pg?Math.round(Math.abs(gas-pg)/pg*100):0;
const cmp=pg?`Has gastado un ${p} % ${gas<=pg?'menos':'más'} que en ${MN(nx(ym,-1))}`:'Sin datos del mes anterior';
const ms=[...Array(6)].map((_,i)=>nx(ym,i-5)),D=ms.map(m=>{const t=tx(m),e=t.filter(x=>x.t==='g');return{m,e,tot:sum(e),inc:(S.inc[m]||0)+sum(t.filter(x=>x.t==='i'))}});
const mx=Math.max(1,...D.map(d=>Math.max(d.tot,d.inc))),H=150,k=H/mx;
let svg=`<svg viewBox="0 0 340 190" width="100%">`;D.forEach((d,i)=>{let y=H+10;const x=14+i*54;S.cats.forEach(c=>{const h=sum(d.e.filter(t=>t.c===c.id))*k;if(h>0){y-=h;svg+=`<rect x="${x}" y="${y}" width="34" height="${h}" fill="${c.c}"/>`}});
svg+=`<line x1="${x-4}" x2="${x+38}" y1="${H+10-d.inc*k}" y2="${H+10-d.inc*k}" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/><text x="${x+17}" y="${H+26}" text-anchor="middle" font-size="11" fill="var(--mu)">${MS(d.m)}</text><text x="${x+17}" y="${y-4}" text-anchor="middle" font-size="9" fill="var(--tx)">${Math.round(d.tot)}</text>`});svg+='</svg>';
let tot=0;const R=S.cats.map(c=>{const s=sum(ex.filter(t=>t.c===c.id));tot+=s;return{c,s,p:c.l?s/c.l:0}});
const al=R.filter(r=>r.p>=.85).map(r=>`${r.c.i} ${r.c.n}: ${r.p>=1?'te has pasado '+E(r.s-r.c.l):'al '+Math.round(r.p*100)+' % del límite'}`);
let a=0;const dn=R.filter(r=>r.s>0).map(r=>{const f=r.s/(tot||1),l=2*Math.PI*40,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${r.c.c}" stroke-width="16" stroke-dasharray="${f*l} ${l}" stroke-dashoffset="${-a*l}" transform="rotate(-90 50 50)"/>`;a+=f;return s}).join('');
const sv=D.map(d=>d.inc-d.tot),smx=Math.max(1,...sv.map(Math.abs)),gl=S.goal;
let L=T.filter(t=>(!F.q||(t.note||'').toLowerCase().includes(F.q.toLowerCase())||cat(t.c).n.toLowerCase().includes(F.q.toLowerCase()))&&(!F.c||t.c===F.c)&&(!F.t||t.t===F.t)&&(!F.m||t.m===F.m)).sort((x,y)=>y.d.localeCompare(x.d));
$('#app').innerHTML=`<div class="top"><button onclick="ym=nx(ym,-1);render()">‹</button><b style="text-transform:capitalize">${MN(ym)}</b><span><button onclick="nx2()">›</button> <button onclick="cfg()">⚙</button></span></div>
<div class="g3"><div class="cd"><div class="mu">Ingresos</div><div class="big" style="color:var(--ok)">${E(inc)}</div></div><div class="cd"><div class="mu">Gastos</div><div class="big">${E(gas)}</div></div><div class="cd"><div class="mu">Me queda</div><div class="big" style="color:${left<0?'var(--bd2)':'var(--tx)'}">${E(left)}</div></div></div>
<p class="mu">${cmp}</p>${al.length?`<div class="al"><b>⚠️ Atención</b><br>${al.join('<br>')}</div>`:''}
<div class="cd"><h2>Reparto de gastos</h2><div class="row"><svg viewBox="0 0 100 100" width="150">${dn||'<circle cx="50" cy="50" r="40" fill="none" stroke="var(--bd)" stroke-width="16"/>'}<text x="50" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tx)">${Math.round(gas)} €</text></svg><div style="flex:1">${R.filter(r=>r.s>0).map(r=>`<div class="row mu"><span><span style="color:${r.c.c}">●</span> ${r.c.n}</span><span>${Math.round(r.s/tot*100)} %</span></div>`).join('')||'Sin gastos'}</div></div></div>
<div class="cd"><h2>¿En qué se ha ido mi sueldo?</h2><div class="mu">Barras por categoría · línea verde = ingresos</div>${svg}</div>
<div class="cd"><h2>Presupuesto por categoría</h2>${R.map(r=>`<div class="cat"><div class="row"><span>${r.c.i} ${r.c.n}</span><span class="mu"><b style="color:${r.p>=1?'var(--bd2)':'var(--tx)'}">${E(r.s)}</b> / ${E(r.c.l)}</span></div><div class="bar"><i style="width:${Math.min(100,r.p*100)}%;background:${r.p>=1?'var(--bd2)':r.p>=.85?'var(--wa)':r.c.c}"></i></div></div>`).join('')}</div>
<div class="cd"><h2>💰 Ahorro mensual</h2><div class="row"><div><div class="big" style="color:${left<0?'var(--bd2)':'var(--ok)'}">${E(left)}</div><div class="mu">ahorrado este mes · objetivo ${E(S.sv)}</div></div></div><div class="bar" style="margin:8px 0"><i style="width:${Math.max(0,Math.min(100,left/(S.sv||1)*100))}%;background:var(--ok)"></i></div>
<div class="row" style="align-items:flex-end;height:70px">${sv.map((v,i)=>`<div style="flex:1;text-align:center"><div style="height:${Math.abs(v)/smx*50}px;background:${v<0?'var(--bd2)':'var(--ok)'};margin:0 6px;border-radius:5px"></div><span class="mu" style="font-size:11px">${MS(D[i].m)}</span></div>`).join('')}</div>
<hr style="border:0;border-top:1px solid var(--bd);margin:12px 0"><div class="row"><b>🎯 ${gl.n}</b><button onclick="goal()">Editar</button></div><div class="bar" style="margin:6px 0"><i style="width:${Math.min(100,gl.s/(gl.t||1)*100)}%;background:var(--pr)"></i></div><div class="mu">${E(gl.s)} de ${E(gl.t)} · faltan ${E(Math.max(0,gl.t-gl.s))}</div></div>
<div class="cd"><div class="row"><h2>Movimientos</h2><button onclick="im()">⬆ Importar extracto</button></div><div class="fl"><input placeholder="Buscar…" value="${F.q}" oninput="F.q=this.value;render2()"><select onchange="F.t=this.value;render()"><option value="">Gasto e ingreso</option><option value="g" ${F.t=='g'?'selected':''}>Gastos</option><option value="i" ${F.t=='i'?'selected':''}>Ingresos</option></select>
<select onchange="F.c=this.value;render()"><option value="">Todas las categorías</option>${S.cats.concat(IC.map(x=>({id:x[0],n:x[1]}))).map(c=>`<option value="${c.id}" ${F.c==c.id?'selected':''}>${c.n}</option>`).join('')}</select><select onchange="F.m=this.value;render()"><option value="">Todos los métodos</option>${MT.map(x=>`<option ${F.m==x?'selected':''}>${x}</option>`).join('')}</select></div><div id="lst">${lst(L)}</div></div>`}
function lst(L){return L.map(t=>{const c=cat(t.c);return`<div class="mv row" onclick="edit('${t.id}')"><span>${c.i||'💰'} <b>${c.n}</b>${t.rec||t.src?' 🔁':''}${t.u?' ❔':''}<br><span class="mu">${t.d.slice(8)}/${t.d.slice(5,7)} · ${t.m}${t.note?' · '+t.note:''}</span></span><b style="color:${t.t=='i'?'var(--ok)':'var(--tx)'}">${t.t=='i'?'+':'−'}${E(t.a)}</b></div>`}).join('')||'<p class="mu">Sin movimientos</p>'}
function render2(){const T=tx(ym).filter(t=>!F.q||(t.note||'').toLowerCase().includes(F.q.toLowerCase())||cat(t.c).n.toLowerCase().includes(F.q.toLowerCase()));$('#lst').innerHTML=lst(T.filter(t=>(!F.c||t.c===F.c)&&(!F.t||t.t===F.t)&&(!F.m||t.m===F.m)).sort((x,y)=>y.d.localeCompare(x.d)))}
function nx2(){ym=nx(ym,1);render()}
function op(h){$('#mb').innerHTML=h;$('#m').style.display='flex'}function cl(){$('#m').style.display='none';render()}
let ET='g';
function edit(id){const t=S.tx.find(x=>x.id===id)||{t:'g',d:new Date().toISOString().slice(0,10),m:'Tarjeta',a:'',c:'com',note:''};ET=t.t;window.CUR=id||null;
op(`<h2>${id?'Editar':'Nuevo'} movimiento</h2><div class="fl"><button id="bg" onclick="tt('g')">Gasto</button><button id="bi" onclick="tt('i')">Ingreso</button></div><input id="a" type="number" step="0.01" inputmode="decimal" placeholder="Importe €" value="${t.a}"><select id="c"></select><input id="d" type="date" value="${t.d}"><select id="mt">${MT.map(x=>`<option ${t.m==x?'selected':''}>${x}</option>`).join('')}</select><input id="n" placeholder="Nota (opcional)" value="${t.note||''}"><label><input type="checkbox" id="r" style="width:auto" ${t.rec?'checked':''}> Se repite cada mes</label><div class="fl" style="margin-top:10px"><button class="pr" onclick="sv_()">Guardar</button>${id?'<button onclick="del()">Borrar</button>':'<button onclick="cl()">Cancelar</button>'}</div>`);tt(ET,t.c)}
function tt(x,sel){ET=x;$('#bg').className=x=='g'?'pr':'';$('#bi').className=x=='i'?'pr':'';$('#c').innerHTML=(x=='g'?S.cats.map(c=>[c.id,c.i+' '+c.n]):IC).map(c=>`<option value="${c[0]}" ${sel==c[0]?'selected':''}>${c[1]}</option>`).join('')}
function sv_(){const a=parseFloat($('#a').value);if(!(a>0))return alert('Escribe un importe');const o={id:window.CUR||uid(),t:ET,a,c:$('#c').value,d:$('#d').value||new Date().toISOString().slice(0,10),m:$('#mt').value,note:$('#n').value,rec:$('#r').checked};const i=S.tx.findIndex(x=>x.id===o.id);if(i>=0){const q=S.tx[i];o.src=q.src;o.h=q.h;if(q.desc){o.desc=q.desc;if(q.c!==o.c&&q.t==='g')(S.rules=S.rules||[]).unshift({k:q.desc.toLowerCase().slice(0,16),c:o.c})}S.tx[i]=o}else S.tx.push(o);ym=o.d.slice(0,7);save();cl()}
function del(){S.tx=S.tx.filter(x=>x.id!==window.CUR);save();cl()}
function goal(){op(`<h2>Objetivo de ahorro</h2><input id="gn" value="${S.goal.n}"><input id="gt" type="number" placeholder="Meta €" value="${S.goal.t}"><input id="gs" type="number" placeholder="Ahorrado €" value="${S.goal.s}"><button class="pr" onclick="S.goal={n:$('#gn').value,t:+$('#gt').value,s:+$('#gs').value};save();cl()">Guardar</button>`)}
function cfg(){op(`<h2>⚙ Ajustes · ${MN(ym)}</h2><label class="mu">Sueldo de este mes (€)</label><input id="si" type="number" value="${S.inc[ym]||''}"><label class="mu">Objetivo de ahorro mensual (€)</label><input id="sv" type="number" value="${S.sv}"><button class="pr" onclick="S.inc[ym]=+$('#si').value||0;S.sv=+$('#sv').value||0;save();cl()">Guardar</button>
<h2 style="margin-top:16px">Categorías y límites</h2>${S.cats.map(c=>`<div class="row" style="margin-bottom:6px"><span>${c.i} ${c.n} · ${E(c.l)}</span><span><button onclick="ec('${c.id}')">✏️</button> <button onclick="dc('${c.id}')">🗑</button></span></div>`).join('')}<button onclick="ec()">+ Nueva categoría</button>
<h2 style="margin-top:16px">Datos</h2><div class="fl"><button onclick="bk('csv')">Exportar CSV</button><button onclick="bk('json')">Copia de seguridad</button><button onclick="ld()">Importar copia</button><button onclick="demo()">Datos de ejemplo</button></div><button style="margin-top:8px" onclick="if(confirm('¿Borrar todos los datos?')){S.tx=[];S.inc={};save();cl()}">Borrar todo y empezar de cero</button><div id="bo"></div>`)}
function ec(id){const c=S.cats.find(x=>x.id===id)||{id:uid(),n:'',i:'📦',l:100,c:'#6366f1',nw:1};const n=prompt('Nombre',c.n);if(!n)return;c.n=n;c.i=prompt('Icono (emoji)',c.i)||c.i;c.l=+prompt('Límite mensual €',c.l)||0;c.c=prompt('Color (hex, ej. #ff5500)',c.c)||c.c;if(c.nw){delete c.nw;S.cats.push(c)}save();cfg()}
function dc(id){if(confirm('¿Borrar categoría? Sus gastos dejarán de contar.')){S.cats=S.cats.filter(c=>c.id!==id);save();cfg()}}
function bk(f){let s;if(f=='json')s=JSON.stringify(S);else s='fecha;tipo;categoría;importe;método;nota\n'+S.tx.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(t=>[t.d,t.t=='g'?'gasto':'ingreso',cat(t.c).n,String(t.a).replace('.',','),t.m,(t.note||'').replace(/;/g,',')].join(';')).join('\n');$('#bo').innerHTML=`<p class="mu">Copia este texto y pégalo en Excel o en una nota:</p><textarea id="ta" readonly>${s.replace(/</g,'&lt;')}</textarea><button onclick="$('#ta').select();document.execCommand('copy')">Copiar</button>`}
function ld(){$('#bo').innerHTML=`<p class="mu">Pega aquí tu copia de seguridad:</p><textarea id="ta"></textarea><button class="pr" onclick="try{S=JSON.parse($('#ta').value);save();cl()}catch(e){alert('Copia no válida')}">Importar</button>`}
function demo(){S={cats:DC,tx:[],inc:{},goal:{n:'Viaje a Japón',t:1500,s:420},sv:200};const base=[['casa',580,1,'Transferencia','Alquiler',1],['mem',12,2,'Tarjeta','Netflix',1],['mem',9,4,'Tarjeta','Spotify',1],['sum',95,5,'Tarjeta','Luz y agua'],['sum',60,8,'Tarjeta','Internet y móvil'],['com',48,3,'Tarjeta','Súper'],['com',52,10,'Tarjeta','Súper'],['com',61,17,'Efectivo','Súper'],['gas',40,12,'Tarjeta','Gasolina'],['oci',85,14,'Bizum','Cena'],['oci',70,22,'Tarjeta','Cine y copas'],['via',120,20,'Tarjeta','Escapada']];
[-2,-1,0].forEach((o,i)=>{const m=nx(ym,o);S.inc[m]=1450;if(i)S.tx.push({id:uid(),t:'i',a:150,c:'fre',d:m+'-15',m:'Transferencia',note:'Clase particular',rec:false});base.forEach((b,j)=>{if(i&&b[5])return;S.tx.push({id:uid(),t:'g',c:b[0],a:Math.round(b[1]*(1+((i*7+j*3)%5)/20)*100)/100,d:m+'-'+String(b[2]).padStart(2,'0'),m:b[3],note:b[4],rec:!!b[5]})})});save();cl()}
const DR=[['com','mercadona,carrefour,lidl,aldi,consum,alcampo,eroski,supermercado,panader'],['gas','repsol,cepsa,galp,shell,gasolinera,petronor,ballenoil,plenergy'],['mem','netflix,spotify,hbo,disney,prime video,amazon prime,gimnasio,gym,youtube,icloud,openai,claude'],['sum','endesa,iberdrola,naturgy,agua,vodafone,movistar,orange,digi,telefonica,holaluz,yoigo,masmovil'],['casa','alquiler,hipoteca,comunidad,ikea,leroy,bricomart,seguro hogar'],['oci','restaurante,cine,cinesa,kinepolis,glovo,just eat,uber eats,mcdonald,burger,telepizza,cervecer,cafeter,starbucks,steam,playstation,nintendo'],['via','booking,airbnb,ryanair,vueling,iberia,renfe,ouigo,alsa,blablacar,hotel,easyjet,trainline,edreams']].flatMap(r=>r[1].split(',').map(k=>({k,c:r[0]})));
const RL=()=>(S.rules||[]).concat(DR);let P=[];
function pn(v){if(typeof v==='number')return v;let s=String(v||'').replace(/[€\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)}
function pd(v){if(typeof v==='number'&&v>20000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const s=String(v||'').trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m)return(m[3].length==2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');m=s.match(/^\d{4}-\d{2}-\d{2}/);return m?m[0]:null}
function csvRows(t){const f=t.includes(';')?';':(t.includes('\t')?'\t':',');return t.split(/\r?\n/).filter(l=>l.trim()).map(l=>{const o=[];let c='',q=0;for(const ch of l){if(ch=='"')q=!q;else if(ch==f&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())})}
function an(rows){const hi=rows.findIndex(r=>r.some(c=>/fecha/i.test(c))&&r.some(c=>/importe/i.test(c)));let di=0,ai=4,ds=[2,3];if(hi>=0){const h=rows[hi].map(c=>String(c).toLowerCase());di=h.findIndex(c=>c.includes('fecha')&&!c.includes('valor'));if(di<0)di=h.findIndex(c=>c.includes('fecha'));ai=h.findIndex(c=>c.includes('importe'));ds=h.map((c,i)=>/movimiento|concepto|descrip|datos/.test(c)?i:-1).filter(i=>i>=0)}const out=[];rows.slice(hi+1).forEach(r=>{const d=pd(r[di]),a=pn(r[ai]);if(!d||isNaN(a)||!a)return;out.push({d,a,desc:ds.map(i=>r[i]||'').join(' ').replace(/\s+/g,' ').trim()})});return out}
const mth=l=>/bizum/.test(l)?'Bizum':/transf|recibo|adeudo/.test(l)?'Transferencia':/efectivo|cajero|reintegro/.test(l)?'Efectivo':'Tarjeta';
function im(){op(`<h2>Importar extracto</h2><p class="mu">Descarga tus movimientos de CaixaBank (Excel o CSV) y súbelos aquí, o pega las filas.</p><input type="file" id="fi" accept=".csv,.txt,.xls,.xlsx" onchange="fl(this.files[0])"><textarea id="pt" placeholder="…o pega aquí el extracto"></textarea><button onclick="pr(csvRows($('#pt').value))">Analizar texto pegado</button><div id="pv"></div>`)}
function fl(f){if(!f)return;const r=new FileReader(),x=/\.xlsx?$/i.test(f.name);r.onload=()=>{try{if(x){if(typeof XLSX==='undefined')return alert('No se pudo cargar el lector de Excel. Guarda el extracto como CSV.');const w=XLSX.read(r.result,{type:'array'});pr(XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,raw:true,defval:''}))}else pr(csvRows(r.result))}catch(e){alert('No he podido leer el archivo')}};x?r.readAsArrayBuffer(f):r.readAsText(f,'windows-1252')}
function pr(rows){const o=an(rows),seen=new Set(S.tx.map(t=>t.h).filter(Boolean));P=[];let sk=0,dp=0,sa=0;o.forEach(x=>{const l=x.desc.toLowerCase();if(/bankinter|traspaso|ahorro/.test(l)){sk++;sa+=Math.abs(x.a);return}const h=x.d+'|'+x.a+'|'+l.slice(0,30);if(seen.has(h)){dp++;return}const g=x.a<0,r=g?RL().find(q=>l.includes(q.k)):null;P.push({id:uid(),t:g?'g':'i',a:Math.abs(x.a),c:g?(r?r.c:'via'):(/n.mina|salario|haberes/.test(l)?'nom':'otr'),d:x.d,m:mth(l),note:x.desc.slice(0,60),desc:x.desc,h,u:g&&!r?1:0,rec:false})});
$('#pv').innerHTML=o.length?`<p><b>${P.length}</b> movimientos nuevos · gastos ${E(sum(P.filter(t=>t.t=='g')))} · ingresos ${E(sum(P.filter(t=>t.t=='i')))}<br><span class="mu">${P.filter(t=>t.u).length} sin categoría clara (los verás con ❔ en Viajes y gastos puntuales: edítalos y la app aprende) · ${dp} repetidos omitidos · ${sk} traspasos a ahorro (${E(sa)}) omitidos. Si hay nómina, el sueldo manual de ese mes pasa a 0 para no contarlo dos veces.</span></p><button class="pr" onclick="ok()">Importar ${P.length}</button>`:'<p class="mu">No he encontrado movimientos. Comprueba que el archivo tiene columnas Fecha e Importe.</p>'}
function ok(){const nm=new Set();P.forEach(t=>{if(t.c==='nom')nm.add(t.d.slice(0,7));S.tx.push(t)});nm.forEach(m=>S.inc[m]=0);save();const m=P.map(t=>t.d.slice(0,7)).sort().pop();if(m)ym=m;cl()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();render();
</script></body></html>
